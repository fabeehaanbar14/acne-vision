    <!-- Firebase Scripts (Global) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <script>
         
        const firebaseConfig = {
            apiKey: "AIzaSyDOYdeSkSxmRkj_q1rSJrPHV40vVmQkiF4",
            authDomain: "acnevision-85adc.firebaseapp.com",
            projectId: "acnevision-85adc",
            storageBucket: "acnevision-85adc.firebasestorage.app",
            messagingSenderId: "790385055700",
            appId: "1:790385055700:web:2c47213a66d4e489df6841"
        };

       //firbase initialisation
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        //variables
        const signupBtn = document.getElementById("signup-btn");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");

        //click listener to create users upon form fill in
        signupBtn.addEventListener("click", async () => {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                alert("Please enter both username and password");
                return;
            }

            // create a fake user for the email so they can enter a simple username
            const userEmail = `${username}@app.local`;

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(userEmail, password);
                window.location.href="index.html";
                //alert("Signup successful! UID: " + userCredential.user.uid);

              //save user info
                await db.collection("users").doc(userCredential.user.uid).set({
                    username: username,
                    createdAt: new Date()
                });

                console.log("User saved to Firestore");

            } catch (error) {
                alert("Error: " + error.message);
            }
        });
    </script>
    <script>

        const pInput = document.getElementById("password");
        const checkmark = document.querySelector(".checkmark");


        const passwordFeedback = document.getElementById("pass-text");

        function makeVisible(element) {

            element.style.display = "flex";

        }

        function makeInvisible(element) {

            element.style.display = "none";
        }


        document.addEventListener("DOMContentLoaded", () => {
            makeInvisible(checkmark);
        });

        passwordInput.addEventListener("input", () => {
            const value = pInput.value;

            if (value.length >= 8) {
                passwordFeedback.textContent = "password accepted";
                makeVisible(passwordFeedback);
                makeVisible(checkmark);
            }

            else {
                passwordFeedback.textContent = "password should be 8 characters or longer";
                makeVisible(passwordFeedback);
                makeInvisible(checkmark);

            }
        });
      </script>
